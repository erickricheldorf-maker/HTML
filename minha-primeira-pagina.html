<!DOCTYPE html> 
<html lang="pt-BR"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Clube Patinhas</title>
    </head>
    <body>
       <h1>Clube Patinhas</h1>
       <!-- h1 é uma tag de título -->
       <!-- Um único h1 por página: o assunto principal -->
       <!-- Existem seis níveis de títulos, do h1 ao h6 -->
       <!-- Não se pula ordem:depois de h1, vem h2, depois h3, e assim por diante --> 
       <h2>Como cuidar</h2>
       <h3>Alimentação</h3>
       <p>Escove os dentes <em>só com pasta para cães</em>.</p>
       <h3>Passeios</h3>
       <p>Filhotes só passeiam <strong>com as vacinas em dia</strong>.</p>
       <!-- A tag p é para parágrafos de texto -->
       <!-- A tag strong é para uso de negrito e em para itálico--> 
       <ol>
            <li>Pegar a guia</li>
            <li>Passear</li>
            <li>Dar água</li>
       </ol> 

       <h2>Raças</h2>
       <ul>
            <li>Beagle</li>
            <li>Poodle</li>
            <li>Vira-lata</li>
       </ul>
       <!-- Lista não ordenada.-->
       <!-- A tag ul abre a lista e li são os elementos desta lista --> 

       <dl>
            <dt>Filhote</dt>
            <dd>Cão com menos de um ano.</dd>
       </dl>
       <!-- Usado para criar uma definição -->
       <!-- A tag dt é para o título e dd para descrição -->
       
       <a href="https://pt.wikipedia.org/wiki/C%C3%A3o" target="_blank"
       rel="noopener noreferrer">sobre cães - Wikipedia</a>
       <!-- A tag a é para criar links -->
       <!-- No atributo href, colocamos o endereço da página que queremos redirecionar -->
       <!-- O atributo target é usado para indicar se, ao clicar no link, a pagina abrirá na mesma aba/janela ou em uma nova aba/nova janela-->
       <!-- O atributo rel="noopener noreferrer" define que, ao clicar no lin e abrir uma nova aba, ele não poderá manipular a aba original(reverse tabnabbing) e impedirá que o site de destino saiba de qual página veio o tráfego original -->
       
      <img src="Caramelo.jpg" alt="um cachorro caramelo,representnte oficial do Brasil."> 

</body>
</html>
